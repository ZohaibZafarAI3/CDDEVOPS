services:
  web:
    build: .
    command: flask run --debug
    ports:
      - "${APP_PORT}:5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_RUN_HOST=0.0.0.0
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    volumes:
      - code_vol:/code
    networks:
      - app_net
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:alpine
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  app_net:

volumes:
  code_vol:
